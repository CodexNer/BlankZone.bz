<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — OOS</title>
  <link rel="icon" type="image/png" href="bz_logo.png">

  <!-- Discord / Open Graph Embed -->
  <meta name="theme-color" content="#d91eff">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Outcasts Organization Software — Directory">
  <meta property="og:description" content="Directory Software for Blank Zone chronicles and entries. Click to go to folder/file.">
  <meta property="og:image" content="https://codexner.github.io/BlankZone.bz/bz_logo.png">
  <meta name="twitter:card" content="summary">

  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #d0d7de;
      background: #121417;
    }

    /* Top Header (Full Width) */
    .navbar {
      width: 100%;
      padding: 12px 24px 11px;
      border-bottom: 1px solid #2a2f38;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: #181b20;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #e6edf3;
      font-family: "Courier New", Courier, "Lucida Console", monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }
    .brand:hover {
      color: #ffffff;
    }
    .brand-logo {
      flex-shrink: 0;
      filter: drop-shadow(0 0 5px rgba(217, 30, 255, 0.35));
    }

    /* Right-side Developer & Copyright Notice */
    .nav-credits {
      margin-left: auto;
      text-align: right;
      font-family: "Courier New", Courier, "Lucida Console", monospace;
      font-size: 10.5px;
      line-height: 1.45;
      color: #8b949e;
      border-left: 1px solid #2d333b;
      padding-left: 14px;
    }
    .nav-credits .nav-dev strong {
      color: #c9d1d9;
      font-weight: 700;
    }
    .nav-credits .nav-legal {
      font-size: 9.5px;
      color: #6e7681;
    }
    #lastUpdatedBadge {
      color: #8b949e;
    }

    /* Main Container (Full Page) */
    .container {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 24px 24px;
      min-height: 0;
    }

    /* Buttons */
    .btn {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 3px;
      padding: 5px 11px;
      font-size: 12px;
      color: #c9d1d9;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
    }
    .btn:hover {
      background: #30363d;
      border-color: #484f58;
      color: #ffffff;
    }
    .btn-lock {
      background: #272118;
      border-color: #5c431f;
      color: #e3b341;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      padding: 3px 9px;
    }
    .btn-lock:hover {
      background: #382e1f;
      border-color: #e3b341;
      color: #fde047;
    }

    /* Shared Panel Shell (Directory & Content Viewer) */
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid #2d333b;
      border-radius: 4px;
      overflow: hidden;
      background: #181b20;
      min-height: 0;
    }
    .list-header {
      background: #21262d;
      padding: 9px 14px;
      border-bottom: 1px solid #2d333b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .breadcrumb a {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }
    .breadcrumb a:hover {
      text-decoration: underline;
      color: #79c0ff;
    }
    .breadcrumb span.sep {
      color: #6e7681;
    }
    .breadcrumb span.current-file {
      color: #e6edf3;
      font-weight: 700;
    }

    /* Aligned 3-Column Grid (Name | Type | Date Modified) */
    .column-header,
    .file-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 125px 125px;
      align-items: center;
      gap: 12px;
      padding-left: 14px;
      padding-right: 14px;
    }

    .column-header {
      padding-top: 6px;
      padding-bottom: 6px;
      background: #1b1f25;
      border-bottom: 1px solid #2d333b;
      color: #8b949e;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      user-select: none;
    }
    .col-right {
      text-align: right;
    }

    #fileList {
      flex: 1;
      overflow-y: auto;
    }

    /* Full-Bar Interactive Rows */
    .file-row {
      padding-top: 9px;
      padding-bottom: 9px;
      border-bottom: 1px solid #262c34;
      background: #181b20;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.12s ease;
    }
    .file-row:hover {
      background: #222933;
    }
    .file-row:active {
      background: #2a3441;
    }
    .file-row:hover .item-link {
      text-decoration: underline;
      color: #79c0ff;
    }
    .file-row.empty-row {
      display: flex;
      cursor: default;
    }
    .file-row.empty-row:hover {
      background: #181b20;
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .row-left svg {
      flex-shrink: 0;
    }
    .item-link {
      color: #58a6ff;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-type {
      color: #8b949e;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      white-space: nowrap;
    }
    .type-locked {
      display: inline-block;
      background: #272118;
      border: 1px solid #5c431f;
      color: #e3b341;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
    }
    .type-unlocked {
      display: inline-block;
      background: #13261b;
      border: 1px solid #2ea043;
      color: #3fb950;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
    }
    .row-meta {
      color: #8b949e;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      white-space: nowrap;
      text-align: right;
    }

    /* Inline Content Viewer */
    #viewerView {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }
    .viewer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 14px;
      background: #1b1f25;
      border-bottom: 1px solid #2d333b;
      flex-wrap: wrap;
    }
    .viewer-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .viewer-info {
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      color: #8b949e;
    }
    #viewerBody {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: auto;
      background: #121417;
      min-height: 0;
    }
    .viewer-frame {
      width: 100%;
      flex: 1;
      border: none;
      background: #ffffff;
      min-height: 65vh;
    }
    .viewer-frame.drive-frame {
      background: #0d1014;
    }

    /* Image Stage */
    .viewer-media-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
      background: #0d1014;
    }
    .viewer-media-stage img {
      max-width: 100%;
      max-height: 75vh;
      border: 1px solid #2d333b;
      border-radius: 3px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    }

    /* Full-Width Media Workspace (Audio & Video + Transcript + Entries) */
    .media-workspace {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      background: #0d1014;
      min-height: 0;
    }

    /* Top Full-Width Player Card */
    .media-player-banner {
      width: 100%;
      background: #181b20;
      border: 1px solid #2d333b;
      border-radius: 6px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    .media-player-banner.video-banner {
      padding: 0;
      overflow: hidden;
    }
    .video-theater-stage {
      width: 100%;
      background: #050709;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #262c34;
    }
    .video-theater-stage video {
      width: 100%;
      max-height: 54vh;
      display: block;
      background: #000000;
      outline: none;
    }
    .media-workspace.no-subtitles .video-theater-stage video {
      max-height: 72vh;
    }
    .drive-video-full {
      width: 100%;
      height: 54vh;
      min-height: 300px;
      border: none;
      display: block;
      background: #000000;
    }
    .media-workspace.no-subtitles .drive-video-full {
      height: 72vh;
    }
    .video-banner-footer {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .audio-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .audio-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      background: #21262d;
      border: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .audio-title-group {
      min-width: 0;
      flex: 1;
    }
    .audio-title {
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      font-weight: 700;
      color: #e6edf3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .audio-sub {
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      color: #8b949e;
      margin-top: 3px;
    }
    .media-player-banner audio {
      width: 100%;
      height: 42px;
      outline: none;
    }
    .drive-audio-embed {
      width: 100%;
      height: 120px;
      border: 1px solid #2d333b;
      border-radius: 4px;
      background: #0d1014;
      display: block;
    }

    /* Bottom 2-Column Split (Left: Spotify-Style Transcript | Right: Entries) */
    .media-split-grid {
      width: 100%;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.38fr) minmax(300px, 1fr);
      gap: 14px;
      min-height: 380px;
    }

    /* Left Column: Spotify-Style Rolling Transcript */
    .transcript-panel {
      background: #181b20;
      border: 1px solid #2d333b;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 380px;
    }
    .panel-bar-header {
      padding: 9px 14px;
      background: #14181f;
      border-bottom: 1px solid #262c34;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .spotify-lyrics-stage {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 18px 0;
      text-align: center;
      background: radial-gradient(circle at 50% 50%, rgba(88, 166, 255, 0.07), transparent 70%), #0d1117;
      font-family: "Courier New", Courier, "Lucida Console", monospace;
      overflow-y: auto;
    }
    .lyric-line {
      width: 100%;
      padding: 8px 0;
      text-align: center;
      transition: all 0.18s ease;
      cursor: pointer;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-line;
    }
    .lyric-line.past {
      font-size: 15px;
      color: #6e7681;
      opacity: 0.85;
    }
    .lyric-line.past:hover {
      color: #adbac7;
      background: rgba(255, 255, 255, 0.03);
      opacity: 1;
    }
    .lyric-line.active {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(88, 166, 255, 0.12);
      border-top: 1px solid rgba(88, 166, 255, 0.35);
      border-bottom: 1px solid rgba(88, 166, 255, 0.35);
      padding: 14px 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      cursor: default;
    }
    .lyric-line.active.gap-state {
      color: #8b949e;
      font-weight: 400;
      font-size: 16px;
      border-top-color: #262c34;
      border-bottom-color: #262c34;
      background: rgba(255, 255, 255, 0.02);
    }
    .lyric-line.upcoming {
      font-size: 15.5px;
      color: #8b949e;
    }
    .lyric-line.upcoming:hover {
      color: #e6edf3;
      background: rgba(255, 255, 255, 0.04);
    }
    .lyric-ts-tag {
      font-size: 11.5px;
      font-weight: 600;
      color: #58a6ff;
      margin-right: 8px;
      opacity: 0.85;
    }
    .lyric-line.active .lyric-ts-tag {
      color: #79c0ff;
      opacity: 1;
    }
    .lyric-gap-badge {
      align-self: center;
      margin: 0 auto;
      text-align: center;
      font-size: 11px;
      color: #e3b341;
      background: rgba(227, 179, 65, 0.08);
      border: 1px dashed rgba(227, 179, 65, 0.35);
      padding: 2px 10px;
      border-radius: 999px;
      user-select: none;
    }

    /* Right Column: Timestamped Entries Log */
    .entries-panel {
      background: #181b20;
      border: 1px solid #2d333b;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 380px;
      max-height: 500px;
    }
    .audio-log-list {
      flex: 1;
      overflow-y: auto;
      background: #0d1117;
      scroll-behavior: smooth;
    }
    .audio-log-line {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 10px;
      padding: 9px 13px;
      border-bottom: 1px solid #181c23;
      font-family: "Courier New", Courier, "Lucida Console", monospace;
      font-size: 13px;
      line-height: 1.45;
      color: #8b949e;
      cursor: pointer;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .audio-log-line:last-child {
      border-bottom: none;
    }
    .audio-log-line:hover {
      background: #161b22;
      color: #c9d1d9;
    }
    .audio-log-line.active {
      background: #13233a;
      color: #e6edf3;
      box-shadow: inset 3px 0 0 #58a6ff;
    }
    .audio-log-time {
      color: #58a6ff;
      font-size: 12px;
      user-select: none;
      white-space: nowrap;
    }
    .audio-log-line.active .audio-log-time {
      color: #79c0ff;
      font-weight: 700;
    }
    .audio-log-cue-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .viewer-text {
      margin: 0;
      width: 100%;
      padding: 22px 26px;
      font-family: "Courier New", Courier, "Lucida Console", monospace;
      font-size: 13.5px;
      line-height: 1.65;
      color: #e6edf3;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .viewer-loading {
      padding: 24px;
      color: #8b949e;
      font-family: "Courier New", Courier, monospace;
    }

    /* Decrypt Drawer & ARG Hint */
    .decrypt-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 4px;
    }
    .decrypt-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: #e6edf3;
    }
    .decrypt-hint-box {
      display: none;
      margin-bottom: 12px;
      padding: 10px 13px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-left: 3px solid #e3b341;
      border-radius: 3px;
      font-family: "Courier New", Courier, "Lucida Console", monospace;
    }
    .decrypt-hint-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #e3b341;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .decrypt-hint-text {
      font-size: 12.5px;
      line-height: 1.55;
      color: #c9d1d9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .decrypt-hint-text.loading {
      color: #6e7681;
      font-style: italic;
    }
    .decrypt-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .decrypt-controls input {
      padding: 6px 10px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 3px;
      font-size: 13px;
      color: #e6edf3;
      width: 260px;
      outline: none;
    }
    .decrypt-controls input:focus {
      border-color: #58a6ff;
    }
    .btn-primary {
      background: #1f6feb;
      border-color: #388bfd;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #388bfd;
      border-color: #58a6ff;
    }
    .error-text {
      color: #f85149;
      font-size: 12px;
      margin-top: 8px;
    }

    /* Responsive Breakpoints (Tablet & Phone Vertical Stacking) */
    @media (max-width: 820px) {
      .media-split-grid {
        grid-template-columns: 1fr;
        min-height: 0;
      }
      .transcript-panel {
        min-height: 320px;
      }
      .entries-panel {
        min-height: 250px;
        max-height: 320px;
      }
      .lyric-line.active {
        font-size: 18px;
      }
      .lyric-line.past,
      .lyric-line.upcoming {
        font-size: 14px;
      }
    }

    @media (max-width: 720px) {
      .navbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .nav-credits {
        margin-left: 0;
        text-align: left;
        border-left: none;
        padding-left: 0;
        border-top: 1px solid #262c34;
        padding-top: 6px;
        width: 100%;
      }
    }

    @media (max-width: 560px) {
      .navbar { padding: 10px 14px; }
      .brand { font-size: 16px; gap: 9px; }
      .container { padding: 10px 14px 16px; }
      .column-header,
      .file-row {
        grid-template-columns: minmax(0, 1fr) 98px 94px;
        padding-left: 10px;
        padding-right: 10px;
      }
      .viewer-text {
        padding: 14px 16px;
        font-size: 12.5px;
      }
      .media-workspace {
        padding: 10px;
        gap: 10px;
      }
      .media-player-banner {
        padding: 12px 14px;
      }
      .spotify-lyrics-stage {
        padding: 16px 0;
      }
      .lyric-line.active {
        font-size: 17px;
        padding: 12px 0;
      }
      .viewer-media-stage { padding: 12px; }
    }
  </style>
</head>

      <div class="nav-dev">Made and Developed by <strong><b style="color: rgb(213, 33, 213);">CodexNer</b> &amp; <b style="color: rgb(233, 233, 27);">Athena</b></strong></div>
      <div class="nav-legal">&copy; 2026 Outcasts Organization. All rights reserved. Unauthorized copying, modification, or redistribution is prohibited.<br>We are watching.<span id="lastUpdatedBadge"></span></div>
    </div>
  </header>

  <main class="container">
    <div class="main-panel">
      <div class="list-header">
        <nav class="breadcrumb" id="breadcrumb"></nav>
        <div id="headerActions"></div>
      </div>

      <!-- DIRECTORY TABLE VIEW -->
      <div id="directoryView" style="display:flex; flex-direction:column; flex:1; min-height:0;">
        <div class="column-header">
          <span>Name</span>
          <span>Type</span>
          <span class="col-right">Date Modified</span>
        </div>
        <div id="fileList"></div>
      </div>

      <!-- INLINE CONTENT VIEWER -->
      <div id="viewerView">
        <div class="viewer-toolbar">
          <div class="viewer-actions">
            <button class="btn" type="button" onclick="closeViewer()">← Back</button>
            <span class="viewer-info" id="viewerMeta"></span>
          </div>
          <a class="btn" id="viewerRawLink" href="#" target="_blank" rel="noopener">Open Raw ↗</a>
        </div>
        <div id="viewerBody"></div>
      </div>
    </div>

    <!-- AES-GCM Passphrase & ARG Hint Box -->
    <div id="decryptBox" class="decrypt-box">
      <div class="decrypt-box-header">
        <span id="decryptPromptLabel">🔒 Enter clearance passphrase:</span>
        <button class="btn" onclick="closeDecryptBox()">✕</button>
      </div>
      <div id="decryptHintBox" class="decrypt-hint-box">
        <div class="decrypt-hint-label">📡 INTERCEPTED CLUE // HINT</div>
        <div id="decryptHintText" class="decrypt-hint-text"></div>
      </div>
      <div class="decrypt-controls">
        <input type="password" id="passInput" placeholder="Passphrase..." onkeydown="if(event.key==='Enter') handleDecryptSubmit()">
        <button class="btn btn-primary" id="decryptSubmitBtn" onclick="handleDecryptSubmit()">Decrypt & Open</button>
      </div>
      <div id="decryptError" class="error-text"></div>
    </div>
  </main>

  <script>
    const DEFAULT_GITHUB_REPO = 'CodexNer/BlankZone.bz';
    const LYRIC_WINDOW_SECONDS = 10;

    let repoEntries = [];
    let currentPath = '';
    let activeFile = null;
    let activeBlobUrl = null;
    let pendingDecrypt = null;

    // Stores unlocked vaults in memory: Map<virtualRootPath, Array<virtualEntry>>
    const unlockedVaults = new Map();

    const IMAGE_EXTS = new Set(['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'ico']);
    const VIDEO_EXTS = new Set(['mp4', 'webm', 'ogv', 'mov', 'm4v']);
    const AUDIO_EXTS = new Set(['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac', 'opus']);
    const FRAME_EXTS = new Set(['html', 'htm', 'pdf']);

    const ICONS = {
      home: `<svg width="14" height="14" viewBox="0 0 16 16" fill="#58a6ff"><path d="M8 1.5L1 7.5h2v6h4v-4h2v4h4v-6h2L8 1.5z"/></svg>`,
      folder: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#8b949e" stroke-width="1.3"><path d="M1.5 3.5h4.5l1.5 1.5h7v7.5h-13z"/></svg>`,
      folderLocked: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#e3b341" stroke-width="1.3"><path d="M1.5 3.5h4.5l1.5 1.5h7v7.5h-13z"/><rect x="9.5" y="7.5" width="4.5" height="3.8" rx="0.6" fill="#181b20"/><path d="M10.6 7.5V6.3a1.15 1.15 0 0 1 2.3 0v1.2"/></svg>`,
      folderUnlocked: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#3fb950" stroke-width="1.3"><path d="M1.5 3.5h4.5l1.5 1.5h7v7.5h-13z"/></svg>`,
      notebook: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#8b949e" stroke-width="1.3"><rect x="3" y="1.5" width="10" height="13" rx="1"/><line x1="5.5" y1="5" x2="10.5" y2="5"/><line x1="5.5" y1="8" x2="10.5" y2="8"/><line x1="5.5" y1="11" x2="8.5" y2="11"/></svg>`,
      image: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#8b949e" stroke-width="1.3"><rect x="2" y="2.5" width="12" height="11" rx="1"/><circle cx="5.5" cy="6" r="1.1"/><path d="M2.5 11.5l3.2-3.2 2.3 2.3 2.5-2.5 3 3.4"/></svg>`,
      video: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#8b949e" stroke-width="1.3"><rect x="1.8" y="3" width="12.4" height="10" rx="1.2"/><polygon points="6.5,5.5 11,8 6.5,10.5" fill="#8b949e" stroke="none"/></svg>`,
      audio: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#8b949e" stroke-width="1.3"><path d="M2.5 6.2h2.4l3.1-2.7v9l-3.1-2.7H2.5z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5"/><path d="M12.3 3.8a6 6 0 0 1 0 8.4"/></svg>`,
      lock: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#e3b341" stroke-width="1.3"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>`
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function isVaultFile(item) {
      return item && item.type === 'file' && item.name.toLowerCase().endsWith('.vault.txt');
    }

    function isLockedLinkFile(item) {
      return item && item.type === 'file' && (item.locked || item.name.toLowerCase().endsWith('.locked.txt'));
    }

    function isVideoLinkFile(item) {
      if (!item || item.type !== 'file') return false;
      const lower = item.name.toLowerCase();
      if (
        lower.endsWith('.video.link.txt') ||
        lower.endsWith('.video.link') ||
        lower.endsWith('.video.url') ||
        lower.endsWith('.video.download') ||
        lower.endsWith('.video.locked.txt')
      ) return true;
      if (lower.endsWith('.link.txt') || lower.endsWith('.url') || lower.endsWith('.link')) {
        const base = lower.replace(/(\.link\.txt|\.url|\.link)$/, '');
        return VIDEO_EXTS.has(getExtension(base));
      }
      if (lower.endsWith('.locked.txt')) {
        const base = lower.replace(/\.locked\.txt$/, '');
        return VIDEO_EXTS.has(getExtension(base));
      }
      return false;
    }

    function isAudioLinkFile(item) {
      if (!item || item.type !== 'file') return false;
      const lower = item.name.toLowerCase();
      if (
        lower.endsWith('.audio.link.txt') ||
        lower.endsWith('.audio.link') ||
        lower.endsWith('.audio.url') ||
        lower.endsWith('.audio.download') ||
        lower.endsWith('.audio.locked.txt')
      ) return true;
      if (lower.endsWith('.link.txt') || lower.endsWith('.url') || lower.endsWith('.link')) {
        const base = lower.replace(/(\.link\.txt|\.url|\.link)$/, '');
        return AUDIO_EXTS.has(getExtension(base));
      }
      if (lower.endsWith('.locked.txt')) {
        const base = lower.replace(/\.locked\.txt$/, '');
        return AUDIO_EXTS.has(getExtension(base));
      }
      return false;
    }

    function isLinkFile(item) {
      if (!item || item.type !== 'file') return false;
      const lower = item.name.toLowerCase();
      return (
        lower.endsWith('.link.txt') ||
        lower.endsWith('.url') ||
        lower.endsWith('.link') ||
        isVideoLinkFile(item) ||
        isAudioLinkFile(item)
      );
    }

    function getVaultVirtualPath(vaultItem) {
      return vaultItem.path.replace(/\.vault\.txt$/i, '');
    }

    function getAllCombinedEntries() {
      const combined = [...repoEntries];
      unlockedVaults.forEach((entries) => {
        combined.push(...entries);
      });
      return combined;
    }

    function findActiveVaultRoot(path) {
      for (const vaultRoot of unlockedVaults.keys()) {
        if (path === vaultRoot || path.startsWith(vaultRoot + '/')) {
          return vaultRoot;
        }
      }
      return null;
    }

    function getPathFromHash() {
      const raw = window.location.hash.replace(/^#\/?/, '');
      return raw ? decodeURIComponent(raw) : '';
    }

    function buildHashUrl(targetPath) {
      if (!targetPath) {
        return window.location.pathname + window.location.search;
      }
      const encoded = targetPath.split('/').map(encodeURIComponent).join('/');
      return '#' + encoded;
    }

    function seedHistoryForFolder(folderPath) {
      history.replaceState({ path: '', file: null }, '', buildHashUrl(''));
      if (!folderPath) return;
      const parts = folderPath.split('/');
      let accum = '';
      parts.forEach((part, idx) => {
        accum = idx === 0 ? part : `${accum}/${part}`;
        history.pushState({ path: accum, file: null }, '', buildHashUrl(accum));
      });
    }

    window.addEventListener('popstate', (event) => {
      if (event.state && typeof event.state.path === 'string') {
        if (event.state.file) {
          const entry = getAllCombinedEntries().find(e => e.path === event.state.file);
          if (entry) {
            currentPath = event.state.path;
            if (event.state.unlockedUrl) {
              openLinkInViewer(entry, event.state.unlockedUrl, false);
            } else {
              openFileViewer(entry, false);
            }
            return;
          }
        }
        navigateTo(event.state.path, false);
        return;
      }
      resolveRouteFromHash(false);
    });

    function resolveRouteFromHash(seedHistory = true) {
      const hashPath = getPathFromHash();
      const combined = getAllCombinedEntries();
      const matchedFile = combined.find(e => e.path === hashPath && e.type === 'file' && !isLockedLinkFile(e) && !isVaultFile(e));

      if (matchedFile) {
        const lastSlash = matchedFile.path.lastIndexOf('/');
        const parentFolder = lastSlash === -1 ? '' : matchedFile.path.substring(0, lastSlash);
        currentPath = parentFolder;
        if (seedHistory) {
          seedHistoryForFolder(parentFolder);
          history.pushState({ path: parentFolder, file: matchedFile.path }, '', buildHashUrl(matchedFile.path));
        }
        openFileViewer(matchedFile, false);
        return;
      }

      const matchedLockedFile = repoEntries.find(e => e.path === hashPath && isLockedLinkFile(e));
      if (matchedLockedFile) {
        const lastSlash = matchedLockedFile.path.lastIndexOf('/');
        const parentFolder = lastSlash === -1 ? '' : matchedLockedFile.path.substring(0, lastSlash);
        currentPath = parentFolder;
        if (seedHistory) seedHistoryForFolder(parentFolder);
        navigateTo(parentFolder, false);
        openDecryptBox('file', matchedLockedFile);
        return;
      }

      const lockedVault = repoEntries.find(e => {
        if (!isVaultFile(e)) return false;
        const vPath = getVaultVirtualPath(e);
        return !unlockedVaults.has(vPath) && (hashPath === vPath || hashPath.startsWith(vPath + '/'));
      });

      if (lockedVault) {
        const lastSlash = lockedVault.path.lastIndexOf('/');
        const parentFolder = lastSlash === -1 ? '' : lockedVault.path.substring(0, lastSlash);
        currentPath = parentFolder;
        if (seedHistory) seedHistoryForFolder(parentFolder);
        navigateTo(parentFolder, false);
        openDecryptBox('vault', lockedVault);
        return;
      }

      currentPath = hashPath;
      if (seedHistory) {
        seedHistoryForFolder(hashPath);
      }
      navigateTo(hashPath, false);
    }

    function detectGitHubRepo() {
      const host = window.location.hostname.toLowerCase();
      if (host.endsWith('.github.io')) {
        const owner = host.replace(/\.github\.io$/, '');
        const repoSeg = window.location.pathname.split('/').filter(Boolean)[0];
        return `${owner}/${repoSeg || `${owner}.github.io`}`;
      }
      return DEFAULT_GITHUB_REPO;
    }

    function formatRelativeTime(dateInput) {
      const date = dateInput instanceof Date ? dateInput : new Date(dateInput);
      const diffSec = Math.floor((Date.now() - date.getTime()) / 1000);
      if (!Number.isFinite(diffSec) || diffSec < 60) return 'Updated just now';

      const units = [
        { label: 'year', secs: 31536000 },
        { label: 'month', secs: 2592000 },
        { label: 'day', secs: 86400 },
        { label: 'hour', secs: 3600 },
        { label: 'minute', secs: 60 }
      ];

      for (const { label, secs } of units) {
        const count = Math.floor(diffSec / secs);
        if (count >= 1) {
          return `Updated ${count} ${label}${count === 1 ? '' : 's'} ago`;
        }
      }
      return 'Updated just now';
    }

    function renderLastUpdated(dateInput) {
      const el = document.getElementById('lastUpdatedBadge');
      if (!el || !dateInput) return;
      const date = new Date(dateInput);
      if (Number.isNaN(date.getTime())) return;

      el.textContent = ` • ${formatRelativeTime(date)}`;
      el.title = `Last commit: ${date.toLocaleString()}`;
    }

    async function fetchLastCommitTime(fallbackHeaderDate = null) {
      const repo = detectGitHubRepo();
      if (repo) {
        try {
          const res = await fetch(`https://api.github.com/repos/${repo}/commits?per_page=1`, {
            headers: { 'Accept': 'application/vnd.github+json' },
            cache: 'no-store'
          });
          if (res.ok) {
            const commits = await res.json();
            const commitDate = commits?.[0]?.commit?.committer?.date || commits?.[0]?.commit?.author?.date;
            if (commitDate) {
              renderLastUpdated(commitDate);
              return;
            }
          }
        } catch (_) {
          // Fall through to Last-Modified header fallback
        }
      }
      if (fallbackHeaderDate) {
        renderLastUpdated(fallbackHeaderDate);
      }
    }

    async function loadManifest() {
      let manifestLastModified = null;
      try {
        const res = await fetch('manifest.json?t=' + Date.now());
        if (!res.ok) throw new Error('manifest.json not found');
        manifestLastModified = res.headers.get('Last-Modified');
        repoEntries = await res.json();
        resolveRouteFromHash(true);
      } catch (err) {
        document.getElementById('fileList').innerHTML = `
          <div class="file-row empty-row">
            <span style="color:#8b949e;">Waiting for <code>manifest.json</code> — push to GitHub to trigger the auto-indexer.</span>
          </div>`;
        renderBreadcrumb();
      }
      fetchLastCommitTime(manifestLastModified);
    }

    function cleanupViewerMedia() {
      const viewerBody = document.getElementById('viewerBody');
      viewerBody.querySelectorAll('video, audio').forEach(el => {
        el.pause();
        el.removeAttribute('src');
        el.load();
      });
      viewerBody.innerHTML = '';

      if (activeBlobUrl) {
        URL.revokeObjectURL(activeBlobUrl);
        activeBlobUrl = null;
      }
    }

    function navigateTo(folderPath, pushHistory = true) {
      if (pushHistory && (folderPath !== currentPath || activeFile !== null)) {
        history.pushState({ path: folderPath, file: null }, '', buildHashUrl(folderPath));
      }
      currentPath = folderPath;
      activeFile = null;
      cleanupViewerMedia();
      closeDecryptBox();

      document.getElementById('viewerView').style.display = 'none';
      document.getElementById('directoryView').style.display = 'flex';
      renderDirectory();
    }

    function lockVault(vaultRoot) {
      for (const key of Array.from(unlockedVaults.keys())) {
        if (key === vaultRoot || key.startsWith(vaultRoot + '/')) {
          unlockedVaults.delete(key);
        }
      }
      const lastSlash = vaultRoot.lastIndexOf('/');
      const parentFolder = lastSlash === -1 ? '' : vaultRoot.substring(0, lastSlash);
      navigateTo(parentFolder, true);
    }

    function closeViewer() {
      if (history.state && history.state.file) {
        history.back();
      } else {
        navigateTo(currentPath, true);
      }
    }

    function updateDocumentTitle() {
      const segments = ['Home'];
      if (currentPath) {
        segments.push(...currentPath.split('/'));
      }
      if (activeFile) {
        segments.push(getCleanName(activeFile));
      }
      const trail = segments.length > 4
        ? `${segments[0]} / ... / ${segments.slice(-2).join(' / ')}`
        : segments.join(' / ');
      document.title = `${trail} — Outcasts Organization Software`;
    }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumb');
      let html = `<a onclick="navigateTo('')" title="Root">${ICONS.home}</a>`;
      if (currentPath) {
        const parts = currentPath.split('/');
        let accum = '';
        parts.forEach((part, idx) => {
          accum = idx === 0 ? part : `${accum}/${part}`;
          const target = accum;
          html += `<span class="sep">/</span><a onclick="navigateTo('${target}')">${part}</a>`;
        });
      }
      if (activeFile) {
        html += `<span class="sep">/</span><span class="current-file">${getCleanName(activeFile)}</span>`;
      }
      bc.innerHTML = html;

      const actionsEl = document.getElementById('headerActions');
      const activeVaultRoot = findActiveVaultRoot(currentPath);
      if (activeVaultRoot) {
        actionsEl.innerHTML = `<button class="btn btn-lock" type="button" onclick="lockVault('${activeVaultRoot}')">🔒 Lock Folder</button>`;
      } else {
        actionsEl.innerHTML = '';
      }

      updateDocumentTitle();
    }

    function getCleanName(item) {
      if (item.type === 'dir') return item.name;
      if (isVaultFile(item)) return item.name.replace(/\.vault\.txt$/i, '');
      if (isVideoLinkFile(item) || isAudioLinkFile(item)) {
        return item.name
          .replace(/\.(video|audio)\.locked\.txt$/i, '')
          .replace(/\.locked\.txt$/i, '')
          .replace(/\.[a-z0-9]+\.(link\.txt|url|link|download)$/i, '');
      }
      if (isLockedLinkFile(item)) return item.name.replace(/\.locked\.txt$/i, '');
      if (item.name.toLowerCase().endsWith('.link.txt')) {
        return item.name.replace(/\.link\.txt$/i, '');
      }
      const lastDot = item.name.lastIndexOf('.');
      return lastDot > 0 ? item.name.substring(0, lastDot) : item.name;
    }

    function getExtension(name) {
      const lastDot = name.lastIndexOf('.');
      return (lastDot > 0 && lastDot < name.length - 1)
        ? name.substring(lastDot + 1).toLowerCase()
        : '';
    }

    function getFileType(item) {
      if (isVaultFile(item)) {
        const vPath = getVaultVirtualPath(item);
        return unlockedVaults.has(vPath) ? 'Unlocked' : 'Locked Folder';
      }
      if (item.type === 'dir') return 'Folder';
      if (isVideoLinkFile(item)) return 'VIDEO';
      if (isAudioLinkFile(item)) return 'AUDIO';
      if (isLockedLinkFile(item)) return 'Encrypted';
      if (item.name.toLowerCase().endsWith('.link.txt')) return 'LINK';
      const ext = getExtension(item.name);
      return ext ? ext.toUpperCase() : 'File';
    }

    function getModifiedDate(item) {
      if (item.modified) return item.modified;
      if (item.type === 'dir') {
        const prefix = item.path + '/';
        const childDates = getAllCombinedEntries()
          .filter(e => e.path.startsWith(prefix) && e.modified)
          .map(e => e.modified)
          .sort();
        return childDates.length ? childDates[childDates.length - 1] : '—';
      }
      return '—';
    }

    function renderDirectory() {
      renderBreadcrumb();
      const listEl = document.getElementById('fileList');
      listEl.innerHTML = '';

      if (currentPath !== '') {
        const parentPath = currentPath.includes('/')
          ? currentPath.substring(0, currentPath.lastIndexOf('/'))
          : '';
        const upRow = document.createElement('div');
        upRow.className = 'file-row';
        upRow.title = 'Go to parent folder';
        upRow.onclick = () => navigateTo(parentPath);
        upRow.innerHTML = `
          <div class="row-left">
            ${ICONS.folder}
            <span class="item-link">..</span>
          </div>
          <div class="row-type"></div>
          <div class="row-meta"></div>`;
        listEl.appendChild(upRow);
      }

      const items = getAllCombinedEntries().filter(entry => {
        const lastSlash = entry.path.lastIndexOf('/');
        const parent = lastSlash === -1 ? '' : entry.path.substring(0, lastSlash);
        return parent === currentPath;
      });

      items.sort((a, b) => {
        const aIsDirLike = a.type === 'dir' || isVaultFile(a);
        const bIsDirLike = b.type === 'dir' || isVaultFile(b);
        if (aIsDirLike !== bIsDirLike) return aIsDirLike ? -1 : 1;
        return a.name.localeCompare(b.name);
      });

      if (items.length === 0) {
        const emptyRow = document.createElement('div');
        emptyRow.className = 'file-row empty-row';
        emptyRow.innerHTML = `<span style="color:#8b949e;">Directory is empty.</span>`;
        listEl.appendChild(emptyRow);
        return;
      }

      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'file-row';

        const cleanName = getCleanName(item);
        const fileType = getFileType(item);
        const ext = getExtension(item.name);
        const vault = isVaultFile(item);
        const lockedLink = isLockedLinkFile(item);
        const vaultVirtualPath = vault ? getVaultVirtualPath(item) : '';
        const isVaultUnlocked = vault && unlockedVaults.has(vaultVirtualPath);

        let icon = ICONS.notebook;
        if (vault) {
          icon = isVaultUnlocked ? ICONS.folderUnlocked : ICONS.folderLocked;
          row.title = isVaultUnlocked ? `Open unlocked folder ${cleanName}` : `Unlock folder ${cleanName}`;
        } else if (item.type === 'dir') {
          icon = ICONS.folder;
          row.title = `Open folder ${cleanName}`;
        } else if (VIDEO_EXTS.has(ext) || isVideoLinkFile(item)) {
          icon = ICONS.video;
          row.title = lockedLink ? `Unlock & play video ${cleanName}` : `Play video ${cleanName}`;
        } else if (AUDIO_EXTS.has(ext) || isAudioLinkFile(item)) {
          icon = ICONS.audio;
          row.title = lockedLink ? `Unlock & play audio ${cleanName}` : `Play audio ${cleanName}`;
        } else if (lockedLink) {
          icon = ICONS.lock;
          row.title = `Unlock ${cleanName}`;
        } else if (IMAGE_EXTS.has(ext)) {
          icon = ICONS.image;
          row.title = `View image ${cleanName}`;
        } else {
          row.title = `Open ${cleanName}`;
        }

        const link = document.createElement('a');
        link.className = 'item-link';
        link.textContent = cleanName;
        if (item.type !== 'dir' && !lockedLink && !vault) {
          link.href = buildHashUrl(item.path);
          link.onclick = (e) => {
            e.preventDefault();
            openFileViewer(item, true);
          };
        }

        row.onclick = (e) => {
          if (vault) {
            if (isVaultUnlocked) {
              navigateTo(vaultVirtualPath);
            } else {
              openDecryptBox('vault', item);
            }
          } else if (item.type === 'dir') {
            navigateTo(item.path);
          } else if (lockedLink) {
            openDecryptBox('file', item);
          } else if (e.target.tagName !== 'A') {
            openFileViewer(item, true);
          }
        };

        const left = document.createElement('div');
        left.className = 'row-left';
        left.insertAdjacentHTML('beforeend', icon);
        left.appendChild(link);

        const typeCol = document.createElement('div');
        typeCol.className = 'row-type';
        if (vault) {
          typeCol.innerHTML = isVaultUnlocked
            ? `<span class="type-unlocked">${fileType}</span>`
            : `<span class="type-locked">${fileType}</span>`;
        } else if (lockedLink) {
          typeCol.innerHTML = `<span class="type-locked">${fileType}</span>`;
        } else {
          typeCol.textContent = fileType;
        }

        const meta = document.createElement('div');
        meta.className = 'row-meta';
        meta.textContent = getModifiedDate(item);

        row.appendChild(left);
        row.appendChild(typeCol);
        row.appendChild(meta);
        listEl.appendChild(row);
      });
    }

    function extractTargetUrl(rawText) {
      const trimmed = (rawText || '').trim();
      const iniMatch = trimmed.match(/^URL=(.+)$/im);
      return iniMatch ? iniMatch[1].trim() : trimmed;
    }

    function parseYouTubeStartSeconds(tParam) {
      if (!tParam) return null;
      if (/^\d+$/.test(tParam)) return parseInt(tParam, 10);
      let total = 0;
      const h = tParam.match(/(\d+)h/i);
      const m = tParam.match(/(\d+)m/i);
      const s = tParam.match(/(\d+)s/i);
      if (h) total += parseInt(h[1], 10) * 3600;
      if (m) total += parseInt(m[1], 10) * 60;
      if (s) total += parseInt(s[1], 10);
      return total > 0 ? total : null;
    }

    function extractYouTubeEmbed(parsed) {
      const host = parsed.hostname.toLowerCase().replace(/^www\./, '');
      let videoId = null;
      const playlistId = parsed.searchParams.get('list');

      if (host === 'youtu.be') {
        const seg = parsed.pathname.split('/').filter(Boolean)[0];
        if (seg) videoId = seg;
      } else if (
        host === 'youtube.com' ||
        host === 'm.youtube.com' ||
        host === 'music.youtube.com' ||
        host === 'youtube-nocookie.com'
      ) {
        if (parsed.pathname === '/watch') {
          videoId = parsed.searchParams.get('v');
        } else if (parsed.pathname === '/playlist' && playlistId) {
          return `https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(playlistId)}`;
        } else {
          const pathMatch = parsed.pathname.match(/^\/(?:embed|shorts|live|v|e)\/([a-zA-Z0-9_-]{6,})/);
          if (pathMatch) {
            videoId = pathMatch[1];
          }
        }
      }

      if (!videoId) return null;

      const params = new URLSearchParams();
      params.set('rel', '0');
      const startSec = parseYouTubeStartSeconds(parsed.searchParams.get('start') || parsed.searchParams.get('t'));
      if (startSec) params.set('start', String(startSec));
      if (playlistId) params.set('list', playlistId);

      return `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?${params.toString()}`;
    }

    function toEmbeddableUrl(rawUrl) {
      try {
        const parsed = new URL(rawUrl);
        const host = parsed.hostname.toLowerCase();

        // Google Drive files & folders
        if (host === 'drive.google.com') {
          const fileMatch = parsed.pathname.match(/\/file\/(?:u\/\d+\/)?d\/([a-zA-Z0-9_-]+)/);
          if (fileMatch) {
            return {
              embedUrl: `https://drive.google.com/file/d/${fileMatch[1]}/preview`,
              isEmbed: true,
              provider: 'drive'
            };
          }

          const folderMatch = parsed.pathname.match(/\/drive\/(?:u\/\d+\/)?folders\/([a-zA-Z0-9_-]+)/);
          if (folderMatch) {
            return {
              embedUrl: `https://drive.google.com/embeddedfolderview?id=${folderMatch[1]}#list`,
              isEmbed: true,
              provider: 'drive'
            };
          }

          const queryId = parsed.searchParams.get('id');
          if (queryId && /^\/(?:u\/\d+\/)?(?:open|uc)$/.test(parsed.pathname)) {
            return {
              embedUrl: `https://drive.google.com/file/d/${queryId}/preview`,
              isEmbed: true,
              provider: 'drive'
            };
          }
        }

        // Google Drive direct download host (drive.usercontent.google.com)
        if (host === 'drive.usercontent.google.com') {
          const queryId = parsed.searchParams.get('id');
          if (queryId) {
            return {
              embedUrl: `https://drive.google.com/file/d/${queryId}/preview`,
              isEmbed: true,
              provider: 'drive'
            };
          }
        }

        // Googleusercontent direct file links (lh3.googleusercontent.com/d/<id>)
        if (host.endsWith('.googleusercontent.com')) {
          const gucMatch = parsed.pathname.match(/\/d\/([a-zA-Z0-9_-]+)/);
          if (gucMatch) {
            return {
              embedUrl: `https://drive.google.com/file/d/${gucMatch[1]}/preview`,
              isEmbed: true,
              provider: 'drive'
            };
          }
        }

        // Google Docs, Sheets, Slides & Forms
        if (host === 'docs.google.com') {
          const docsMatch = parsed.pathname.match(/\/(document|spreadsheets|presentation)\/d\/([a-zA-Z0-9_-]+)/);
          if (docsMatch) {
            return {
              embedUrl: `https://docs.google.com/${docsMatch[1]}/d/${docsMatch[2]}/preview`,
              isEmbed: true,
              provider: 'drive'
            };
          }

          const formPublicMatch = parsed.pathname.match(/\/forms\/d\/e\/([a-zA-Z0-9_-]+)/);
          if (formPublicMatch) {
            return {
              embedUrl: `https://docs.google.com/forms/d/e/${formPublicMatch[1]}/viewform?embedded=true`,
              isEmbed: true,
              provider: 'drive'
            };
          }

          const formMatch = parsed.pathname.match(/\/forms\/d\/([a-zA-Z0-9_-]+)/);
          if (formMatch) {
            return {
              embedUrl: `https://docs.google.com/forms/d/${formMatch[1]}/viewform?embedded=true`,
              isEmbed: true,
              provider: 'drive'
            };
          }
        }

        // YouTube Videos, Shorts, Live & Playlists
        const ytEmbed = extractYouTubeEmbed(parsed);
        if (ytEmbed) {
          return {
            embedUrl: ytEmbed,
            isEmbed: true,
            provider: 'youtube'
          };
        }
      } catch (_) {
        // Non-standard URL; fall through as-is
      }

      return { embedUrl: rawUrl, isEmbed: false, provider: null };
    }

    function dataUrlToBlobUrl(dataUrl) {
      const parts = dataUrl.split(',');
      const mimeMatch = parts[0].match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
      const binary = atob(parts[1]);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return URL.createObjectURL(new Blob([bytes], { type: mime }));
    }

    /* WebVTT Pairing & Parser for Audio & Video Players */
    function findMatchingVtt(mediaItem) {
      if (!mediaItem) return null;
      const lastSlash = mediaItem.path.lastIndexOf('/');
      const parentDir = lastSlash === -1 ? '' : mediaItem.path.substring(0, lastSlash);
      const baseLower = getCleanName(mediaItem).toLowerCase();

      const siblings = getAllCombinedEntries().filter(entry => {
        if (entry.type !== 'file') return false;
        const sSlash = entry.path.lastIndexOf('/');
        const sParent = sSlash === -1 ? '' : entry.path.substring(0, sSlash);
        return sParent === parentDir && entry.name.toLowerCase().endsWith('.vtt');
      });

      return (
        siblings.find(s => s.name.toLowerCase() === `${baseLower}.vtt`) ||
        siblings.find(s => s.name.toLowerCase().startsWith(`${baseLower}.`)) ||
        null
      );
    }

    async function loadVttText(vttItem) {
      if (vttItem.virtual) {
        if (vttItem.rawBytes) {
          return new TextDecoder().decode(vttItem.rawBytes);
        }
        return vttItem.content || '';
      }
      const res = await fetch(vttItem.path + '?t=' + Date.now());
      if (!res.ok) throw new Error('Could not fetch VTT subtitle file');
      return res.text();
    }

    function parseVttTimestamp(rawTs) {
      const clean = rawTs.trim().replace(',', '.');
      const parts = clean.split(':');
      if (parts.length === 3) {
        return Number(parts[0]) * 3600 + Number(parts[1]) * 60 + parseFloat(parts[2]);
      }
      if (parts.length === 2) {
        return Number(parts[0]) * 60 + parseFloat(parts[1]);
      }
      return NaN;
    }

    function formatLogTimestamp(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
      const totalSecs = Math.floor(seconds);
      const hrs = Math.floor(totalSecs / 3600);
      const mins = Math.floor((totalSecs % 3600) / 60);
      const secs = totalSecs % 60;
      if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function parseVtt(rawText) {
      const normalized = (rawText || '').replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
      const blocks = normalized.split(/\n{2,}/);
      const cues = [];

      for (const block of blocks) {
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) continue;

        const firstUpper = lines[0].toUpperCase();
        if (firstUpper.startsWith('WEBVTT') || firstUpper.startsWith('NOTE') || firstUpper.startsWith('STYLE') || firstUpper.startsWith('REGION')) {
          continue;
        }

        const timeLineIdx = lines.findIndex(l => l.includes('-->'));
        if (timeLineIdx === -1) continue;

        const timeMatch = lines[timeLineIdx].match(/^([\d:,.]+)\s*-->\s*([\d:,.]+)/);
        if (!timeMatch) continue;

        const start = parseVttTimestamp(timeMatch[1]);
        const end = parseVttTimestamp(timeMatch[2]);
        if (!Number.isFinite(start) || !Number.isFinite(end)) continue;

        const rawPayload = lines.slice(timeLineIdx + 1).join('\n');
        const cleanedText = rawPayload
          .replace(/<v\s+([^>]+)>/gi, '[$1] ')
          .replace(/<\/?[^>]+>/g, '')
          .trim();

        if (cleanedText) {
          cues.push({ start, end, text: cleanedText });
        }
      }

      return cues;
    }

    /* Spotify-Style Rolling Lyrics / Transcript Builder (10s Before & After Preview) */
    function buildSpotifyLyricsHtml(cues, now, isStarted) {
      let activeIdx = -1;
      for (let i = 0; i < cues.length; i++) {
        if (now >= cues[i].start && now <= cues[i].end) {
          activeIdx = i;
        }
      }

      const rows = [];

      if (activeIdx !== -1) {
        // Past lines (up to 2 lines within 10s lookbehind, always keeping immediate previous line)
        const pastStart = Math.max(0, activeIdx - 2);
        for (let i = pastStart; i < activeIdx; i++) {
          const isImmediatePrev = i === activeIdx - 1;
          const withinWindow = (cues[activeIdx].start - cues[i].end) <= LYRIC_WINDOW_SECONDS;
          if (isImmediatePrev || withinWindow) {
            rows.push(`<div class="lyric-line past" data-seek-idx="${i}" title="Seek to ${formatLogTimestamp(cues[i].start)}"><span class="lyric-ts-tag">[${formatLogTimestamp(cues[i].start)}]</span>${escapeHtml(cues[i].text)}</div>`);
          }
        }

        // Active line
        rows.push(`<div class="lyric-line active">${escapeHtml(cues[activeIdx].text)}</div>`);

        // Upcoming lines (up to 3 lines within 10s lookahead, always keeping immediate next line)
        const futureEnd = Math.min(cues.length - 1, activeIdx + 3);
        for (let i = activeIdx + 1; i <= futureEnd; i++) {
          const isImmediateNext = i === activeIdx + 1;
          const gapFromPrev = cues[i].start - cues[i - 1].end;
          const withinWindow = (cues[i].start - cues[activeIdx].end) <= LYRIC_WINDOW_SECONDS;
          if (isImmediateNext || withinWindow) {
            if (gapFromPrev > LYRIC_WINDOW_SECONDS) {
              rows.push(`<div class="lyric-gap-badge">••• +${Math.round(gapFromPrev)}s pause •••</div>`);
            }
            rows.push(`<div class="lyric-line upcoming" data-seek-idx="${i}" title="Seek to ${formatLogTimestamp(cues[i].start)}"><span class="lyric-ts-tag">[${formatLogTimestamp(cues[i].start)}]</span>${escapeHtml(cues[i].text)}</div>`);
          }
        }

        return {
          activeIdx,
          timeLabel: `${formatLogTimestamp(cues[activeIdx].start)} → ${formatLogTimestamp(cues[activeIdx].end)}`,
          html: rows.join('')
        };
      }

      // Currently in a gap / silence between cues
      let prevIdx = -1;
      let nextIdx = -1;
      for (let i = 0; i < cues.length; i++) {
        if (cues[i].end < now) prevIdx = i;
        if (nextIdx === -1 && cues[i].start > now) nextIdx = i;
      }

      if (prevIdx !== -1) {
        if (prevIdx - 1 >= 0 && (cues[prevIdx].start - cues[prevIdx - 1].end) <= LYRIC_WINDOW_SECONDS) {
          rows.push(`<div class="lyric-line past" data-seek-idx="${prevIdx - 1}" title="Seek to ${formatLogTimestamp(cues[prevIdx - 1].start)}"><span class="lyric-ts-tag">[${formatLogTimestamp(cues[prevIdx - 1].start)}]</span>${escapeHtml(cues[prevIdx - 1].text)}</div>`);
        }
        rows.push(`<div class="lyric-line past" data-seek-idx="${prevIdx}" title="Seek to ${formatLogTimestamp(cues[prevIdx].start)}"><span class="lyric-ts-tag">[${formatLogTimestamp(cues[prevIdx].start)}]</span>${escapeHtml(cues[prevIdx].text)}</div>`);
      }

      if (!isStarted && now === 0) {
        rows.push(`<div class="lyric-line active gap-state">[ Press play to begin synced transcript ]</div>`);
      } else if (nextIdx !== -1) {
        const secsLeft = Math.max(1, Math.ceil(cues[nextIdx].start - now));
        const totalGap = prevIdx !== -1
          ? cues[nextIdx].start - cues[prevIdx].end
          : cues[nextIdx].start;
        const gapNote = totalGap > LYRIC_WINDOW_SECONDS
          ? `• • •  (Next line in ${secsLeft}s)`
          : `• • •`;
        rows.push(`<div class="lyric-line active gap-state">${gapNote}</div>`);
      } else {
        rows.push(`<div class="lyric-line active gap-state">[ End of transcript ]</div>`);
      }

      if (nextIdx !== -1) {
        const previewEnd = Math.min(cues.length - 1, nextIdx + 1);
        for (let i = nextIdx; i <= previewEnd; i++) {
          if (i === nextIdx || (cues[i].start - cues[nextIdx].end) <= LYRIC_WINDOW_SECONDS) {
            rows.push(`<div class="lyric-line upcoming" data-seek-idx="${i}" title="Seek to ${formatLogTimestamp(cues[i].start)}"><span class="lyric-ts-tag">[${formatLogTimestamp(cues[i].start)}]</span>${escapeHtml(cues[i].text)}</div>`);
          }
        }
      }

      return {
        activeIdx: -1,
        timeLabel: formatLogTimestamp(now),
        html: rows.join('')
      };
    }

    async function renderMediaWorkspace(viewerBody, { mediaType, src, isDrive = false, isEmbed = false, provider = null, title, subtitle, item = null }) {
      const vttItem = findMatchingVtt(item);
      const isVideo = mediaType === 'video';
      const isEmbeddedFrame = isEmbed || isDrive;
      const logLabel = isVideo ? 'VIDEO LOG' : 'AUDIO LOG';
      const fullSub = `${subtitle}${vttItem ? ' • Subtitles Linked' : ''}`;

      const topPlayerHtml = isVideo
        ? `
          <div class="media-player-banner video-banner">
            <div class="video-theater-stage">
              ${isEmbeddedFrame
                ? `<iframe class="drive-video-full" src="${src}" title="${escapeHtml(title)}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen></iframe>`
                : `<video id="oosMediaPlayer" controls playsinline preload="metadata" src="${src}"></video>`}

                </svg>
              </div>
              <div class="audio-title-group">

                <div class="audio-sub">${escapeHtml(fullSub)}</div>
              </div>
            </div>
          </div>`
        : `
          <div class="media-player-banner">
            <div class="audio-card-header">
              <div class="audio-icon-box">
                <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="#58a6ff" stroke-width="1.4">
                  <path d="M2.5 6.2h2.4l3.1-2.7v9l-3.1-2.7H2.5z"/>
                  <path d="M10.5 5.5a3.5 3.5 0 0 1 0 5"/>
                  <path d="M12.3 3.8a6 6 0 0 1 0 8.4"/>
                </svg>
              </div>
              <div class="audio-title-group">
                <div class="audio-title">${escapeHtml(title)}</div>
                <div class="audio-sub">${escapeHtml(fullSub)}</div>
              </div>
            </div>
            ${isEmbeddedFrame
              ? `<iframe class="drive-audio-embed" src="${src}" title="${escapeHtml(title)}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>`
              : `<audio id="oosMediaPlayer" controls preload="metadata" src="${src}"></audio>`}
          </div>`;

      viewerBody.innerHTML = `
        <div class="media-workspace ${vttItem ? '' : 'no-subtitles'}" id="oosMediaWorkspace">
          ${topPlayerHtml}
          <div id="mediaSplitMount" style="display:none; flex:1; min-height:0;"></div>
        </div>`;

      if (!vttItem) return;

      const workspaceEl = document.getElementById('oosMediaWorkspace');
      const splitMount = document.getElementById('mediaSplitMount');
      const mediaEl = document.getElementById('oosMediaPlayer');
      if (!splitMount) return;

      try {
        const vttText = await loadVttText(vttItem);
        const cues = parseVtt(vttText);
        if (cues.length === 0) {
          if (workspaceEl) workspaceEl.classList.add('no-subtitles');
          return;
        }

        splitMount.style.display = 'flex';
        splitMount.innerHTML = `
          <div class="media-split-grid">
            <div class="transcript-panel">
              <div class="panel-bar-header">
                <span>LIVE TRANSCRIPT // ${escapeHtml(vttItem.name)}</span>
                <span id="liveCueTime">--:--</span>
              </div>
              <div class="spotify-lyrics-stage" id="spotifyLyricsStage"></div>
            </div>
            <div class="entries-panel">
              <div class="panel-bar-header">
                <span>${logLabel} (${cues.length} ENTRIES)</span>
                <span>${mediaEl ? 'CLICK LINE TO SEEK' : (provider === 'youtube' ? 'YOUTUBE PREVIEW' : 'DRIVE PREVIEW')}</span>
              </div>
              <div class="audio-log-list" id="audioLogList">
                ${cues.map((cue, idx) => `
                  <div class="audio-log-line" data-cue-idx="${idx}">
                    <span class="audio-log-time">[${formatLogTimestamp(cue.start)}]</span>
                    <span class="audio-log-cue-text">${escapeHtml(cue.text)}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>`;

        const liveTimeEl = document.getElementById('liveCueTime');
        const lyricsStageEl = document.getElementById('spotifyLyricsStage');
        const logListEl = document.getElementById('audioLogList');
        const lineEls = Array.from(logListEl.querySelectorAll('.audio-log-line'));
        let lastActiveIdx = -2;
        let lastRenderKey = '';

        const seekToCue = (idx) => {
          if (!mediaEl || idx < 0 || idx >= cues.length) return;
          mediaEl.currentTime = cues[idx].start + 0.01;
          if (mediaEl.paused) {
            mediaEl.play().catch(() => {});
          }
        };

        lineEls.forEach((lineEl, idx) => {
          lineEl.onclick = () => seekToCue(idx);
        });

        lyricsStageEl.onclick = (e) => {
          const target = e.target.closest('[data-seek-idx]');
          if (target) {
            seekToCue(Number(target.dataset.seekIdx));
          }
        };

        const syncSubtitles = () => {
          const now = mediaEl ? mediaEl.currentTime : 0;
          const isStarted = mediaEl ? (!mediaEl.paused || mediaEl.currentTime > 0) : false;
          const state = buildSpotifyLyricsHtml(cues, now, isStarted);

          const renderKey = `${state.activeIdx}|${state.timeLabel}|${isStarted ? 1 : 0}`;
          if (renderKey !== lastRenderKey) {
            lastRenderKey = renderKey;
            liveTimeEl.textContent = state.timeLabel;
            lyricsStageEl.innerHTML = state.html;
          }

          if (state.activeIdx !== lastActiveIdx) {
            if (lastActiveIdx >= 0 && lineEls[lastActiveIdx]) {
              lineEls[lastActiveIdx].classList.remove('active');
            }
            lastActiveIdx = state.activeIdx;
            if (state.activeIdx >= 0 && lineEls[state.activeIdx]) {
              const targetLine = lineEls[state.activeIdx];
              targetLine.classList.add('active');
              const targetTop = targetLine.offsetTop - logListEl.offsetTop - (logListEl.clientHeight / 2) + (targetLine.clientHeight / 2);
              logListEl.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });
            }
          }
        };

        syncSubtitles();

        if (mediaEl) {
          mediaEl.addEventListener('timeupdate', syncSubtitles);
          mediaEl.addEventListener('seeked', syncSubtitles);
          mediaEl.addEventListener('play', syncSubtitles);
          mediaEl.addEventListener('pause', syncSubtitles);
        }
      } catch (err) {
        if (workspaceEl) workspaceEl.classList.add('no-subtitles');
        console.warn('Subtitle load skipped:', err);
      }
    }

    async function openFileViewer(item, pushHistory = true) {
      const ext = getExtension(item.name);

      // Handle virtual link entries inside unlocked vaults by embedding inline
      if (item.virtual && isLinkFile(item)) {
        const rawText = item.rawBytes
          ? new TextDecoder().decode(item.rawBytes)
          : (item.content || '');
        const targetUrl = extractTargetUrl(rawText);
        openLinkInViewer(item, targetUrl, pushHistory);
        return;
      }

      if (pushHistory) {
        history.pushState({ path: currentPath, file: item.path }, '', buildHashUrl(item.path));
      }

      activeFile = item;
      cleanupViewerMedia();
      closeDecryptBox();
      renderBreadcrumb();

      document.getElementById('directoryView').style.display = 'none';
      const viewerView = document.getElementById('viewerView');
      const viewerBody = document.getElementById('viewerBody');
      viewerView.style.display = 'flex';

      const cleanName = getCleanName(item);
      const fileType = getFileType(item);
      const modified = getModifiedDate(item);
      const metaLabel = `${fileType} • Modified ${modified}`;
      document.getElementById('viewerMeta').textContent = metaLabel;

      const rawLinkEl = document.getElementById('viewerRawLink');
      rawLinkEl.textContent = 'Open Raw ↗';

      // Public link file (.video.link.txt, .audio.link.txt, .url, .link, etc.)
      if (!item.virtual && isLinkFile(item)) {
        viewerBody.innerHTML = `<div class="viewer-loading">Resolving linked resource...</div>`;
        try {
          const res = await fetch(item.path + '?t=' + Date.now());
          if (!res.ok) throw new Error('Unable to load link file');
          const targetUrl = extractTargetUrl(await res.text());
          openLinkInViewer(item, targetUrl, false);
        } catch (err) {
          viewerBody.innerHTML = `<div class="viewer-loading" style="color:#f85149;">Failed to load ${item.name}.</div>`;
        }
        return;
      }

      // Resolve source URL (public path, OOSV1 binary slice, or legacy JSON content)
      let mediaSrc = item.path;
      let virtualText = null;

      if (item.virtual) {
        if (item.rawBytes) {
          const isTextLike = !IMAGE_EXTS.has(ext) && !VIDEO_EXTS.has(ext) && !AUDIO_EXTS.has(ext) && !FRAME_EXTS.has(ext);
          if (isTextLike) {
            virtualText = new TextDecoder().decode(item.rawBytes);
          }
          activeBlobUrl = URL.createObjectURL(new Blob([item.rawBytes], { type: item.mime || 'application/octet-stream' }));
          mediaSrc = activeBlobUrl;
        } else if (item.content && item.content.startsWith('data:')) {
          activeBlobUrl = dataUrlToBlobUrl(item.content);
          mediaSrc = activeBlobUrl;
        } else if (IMAGE_EXTS.has(ext) || VIDEO_EXTS.has(ext) || AUDIO_EXTS.has(ext)) {
          mediaSrc = (item.content || '').trim();
        } else {
          virtualText = item.content || '';
          const mime = ext === 'pdf'
            ? 'application/pdf'
            : FRAME_EXTS.has(ext)
              ? 'text/html;charset=utf-8'
              : 'text/plain;charset=utf-8';
          activeBlobUrl = URL.createObjectURL(new Blob([virtualText], { type: mime }));
          mediaSrc = activeBlobUrl;
        }
      }

      rawLinkEl.href = mediaSrc;

      if (IMAGE_EXTS.has(ext)) {
        viewerBody.innerHTML = `
          <div class="viewer-media-stage">
            <img src="${mediaSrc}" alt="${escapeHtml(cleanName)}">
          </div>`;
      } else if (VIDEO_EXTS.has(ext)) {
        renderMediaWorkspace(viewerBody, {
          mediaType: 'video',
          src: mediaSrc,
          isEmbed: false,
          title: cleanName,
          subtitle: metaLabel,
          item
        });
      } else if (AUDIO_EXTS.has(ext)) {
        renderMediaWorkspace(viewerBody, {
          mediaType: 'audio',
          src: mediaSrc,
          isEmbed: false,
          title: cleanName,
          subtitle: metaLabel,
          item
        });
      } else if (FRAME_EXTS.has(ext)) {
        viewerBody.innerHTML = `
          <iframe class="viewer-frame" src="${mediaSrc}" title="${escapeHtml(cleanName)}"></iframe>`;
      } else if (item.virtual) {
        const pre = document.createElement('pre');
        pre.className = 'viewer-text';
        pre.textContent = virtualText;
        viewerBody.innerHTML = '';
        viewerBody.appendChild(pre);
      } else {
        viewerBody.innerHTML = `<div class="viewer-loading">Loading file contents...</div>`;
        try {
          const res = await fetch(item.path + '?t=' + Date.now());
          if (!res.ok) throw new Error('Unable to load file');
          const text = await res.text();
          const pre = document.createElement('pre');
          pre.className = 'viewer-text';
          pre.textContent = text;
          viewerBody.innerHTML = '';
          viewerBody.appendChild(pre);
        } catch (err) {
          viewerBody.innerHTML = `<div class="viewer-loading" style="color:#f85149;">Failed to load ${item.name}.</div>`;
        }
      }
    }

    /* Extract optional unencrypted ARG hint header from .vault.txt or .locked.txt */
    function extractHintAndPayload(bytes) {
      if (!bytes || bytes.length === 0) {
        return { hint: '', payloadBytes: bytes };
      }

      // 1. Binary OOSH1 Envelope: "OOSH\x01" + [uint32 hintLength] + [UTF-8 hint] + [payload]
      if (
        bytes.length >= 9 &&
        bytes[0] === 0x4F &&
        bytes[1] === 0x4F &&
        bytes[2] === 0x53 &&
        bytes[3] === 0x48 &&
        bytes[4] === 0x01
      ) {
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        const hintLen = view.getUint32(5, false);
        if (9 + hintLen <= bytes.length) {
          const hint = new TextDecoder().decode(bytes.slice(9, 9 + hintLen)).trim();
          const payloadBytes = bytes.slice(9 + hintLen);
          return { hint, payloadBytes };
        }
      }

      // 2. Text-based ARG Hint Prefix (for .locked.txt files)
      if (bytes[0] === 0x3D || bytes[0] === 0x48 || bytes[0] === 0x68) {
        const fullText = new TextDecoder().decode(bytes);

        const multiMatch = fullText.match(/^=== OOS HINT ===\r?\n([\s\S]*?)\r?\n=== END HINT ===\r?\n([\s\S]*)$/);
        if (multiMatch) {
          return {
            hint: multiMatch[1].trim(),
            payloadBytes: new TextEncoder().encode(multiMatch[2])
          };
        }

        const singleMatch = fullText.match(/^HINT:\s*(.+?)\r?\n(?:---\r?\n)?([\s\S]*)$/i);
        if (singleMatch) {
          return {
            hint: singleMatch[1].trim(),
            payloadBytes: new TextEncoder().encode(singleMatch[2])
          };
        }
      }

      return { hint: '', payloadBytes: bytes };
    }

    function renderDecryptHint(hintText, isLoading = false) {
      const hintBox = document.getElementById('decryptHintBox');
      const hintTextEl = document.getElementById('decryptHintText');

      if (isLoading) {
        hintBox.style.display = 'block';
        hintTextEl.classList.add('loading');
        hintTextEl.textContent = 'Scanning file header for clues...';
        return;
      }

      if (hintText) {
        hintBox.style.display = 'block';
        hintTextEl.classList.remove('loading');
        hintTextEl.textContent = hintText;
      } else {
        hintBox.style.display = 'none';
        hintTextEl.classList.remove('loading');
        hintTextEl.textContent = '';
      }
    }

    async function openDecryptBox(type, item) {
      const requestState = { type, item, payloadBytes: null };
      pendingDecrypt = requestState;

      const label = document.getElementById('decryptPromptLabel');
      const displayName = getCleanName(item);
      label.innerHTML = type === 'vault'
        ? `🔒 Enter clearance passphrase to unlock folder <strong>${escapeHtml(displayName)}</strong>:`
        : `🔒 Enter clearance passphrase to decrypt <strong>${escapeHtml(displayName)}</strong>:`;

      document.getElementById('decryptError').textContent = '';
      document.getElementById('passInput').value = '';
      renderDecryptHint('', true);
      document.getElementById('decryptBox').style.display = 'block';
      document.getElementById('passInput').focus();

      try {
        let rawBytes;
        if (item.virtual && item.rawBytes) {
          rawBytes = item.rawBytes;
        } else {
          const res = await fetch(item.path + '?t=' + Date.now());
          if (!res.ok) throw new Error('Could not fetch encrypted file');
          rawBytes = new Uint8Array(await res.arrayBuffer());
        }

        if (pendingDecrypt !== requestState) return;

        const { hint, payloadBytes } = extractHintAndPayload(rawBytes);
        requestState.payloadBytes = payloadBytes;
        renderDecryptHint(hint, false);
      } catch (_) {
        if (pendingDecrypt === requestState) {
          renderDecryptHint('', false);
        }
      }
    }

    function closeDecryptBox() {
      document.getElementById('decryptBox').style.display = 'none';
      renderDecryptHint('', false);
      pendingDecrypt = null;
    }

    async function deriveAesKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    function mountVirtualFiles(vaultRoot, fallbackDate, fileRecords) {
      const mountedEntries = [];
      const createdDirs = new Set();

      fileRecords.forEach(file => {
        const relPath = file.path.replace(/^\/+/, '');
        const fullPath = `${vaultRoot}/${relPath}`;
        const parts = relPath.split('/');

        if (parts.length > 1) {
          let dirAccum = vaultRoot;
          for (let i = 0; i < parts.length - 1; i++) {
            dirAccum += '/' + parts[i];
            if (!createdDirs.has(dirAccum)) {
              createdDirs.add(dirAccum);
              mountedEntries.push({
                name: parts[i],
                path: dirAccum,
                type: 'dir',
                modified: file.modified || fallbackDate || '',
                virtual: true
              });
            }
          }
        }

        mountedEntries.push({
          name: parts[parts.length - 1],
          path: fullPath,
          type: 'file',
          modified: file.modified || fallbackDate || '',
          mime: file.mime || '',
          rawBytes: file.rawBytes || null,
          content: file.content || '',
          virtual: true
        });
      });

      unlockedVaults.set(vaultRoot, mountedEntries);
      navigateTo(vaultRoot, true);
    }

    async function handleDecryptSubmit() {
      if (!pendingDecrypt) return;
      const activeRequest = pendingDecrypt;
      const password = document.getElementById('passInput').value;
      const errEl = document.getElementById('decryptError');
      const submitBtn = document.getElementById('decryptSubmitBtn');
      errEl.textContent = '';

      submitBtn.disabled = true;
      submitBtn.textContent = 'Decrypting...';

      try {
        let bytes = activeRequest.payloadBytes;
        if (!bytes) {
          let rawBytes;
          if (activeRequest.item.virtual && activeRequest.item.rawBytes) {
            rawBytes = activeRequest.item.rawBytes;
          } else {
            const res = await fetch(activeRequest.item.path + '?t=' + Date.now());
            if (!res.ok) throw new Error('Could not fetch encrypted file');
            rawBytes = new Uint8Array(await res.arrayBuffer());
          }
          const extracted = extractHintAndPayload(rawBytes);
          bytes = extracted.payloadBytes;
          activeRequest.payloadBytes = bytes;
          renderDecryptHint(extracted.hint, false);
        }

        if (activeRequest.type === 'vault') {
          const vaultRoot = getVaultVirtualPath(activeRequest.item);

          // Check for OOSV1 binary magic header ("OOSV")
          if (bytes[0] === 0x4F && bytes[1] === 0x4F && bytes[2] === 0x53 && bytes[3] === 0x56) {
            const salt = bytes.slice(5, 21);
            const iv = bytes.slice(21, 33);
            const ciphertext = bytes.slice(33);

            const key = await deriveAesKey(password, salt);
            const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);

            const view = new DataView(plainBuf);
            const headerLen = view.getUint32(0, false);
            const headerJson = new TextDecoder().decode(new Uint8Array(plainBuf, 4, headerLen));
            const metaList = JSON.parse(headerJson);
            const dataBaseOffset = 4 + headerLen;

            const records = metaList.map(meta => ({
              path: meta.path,
              mime: meta.mime,
              modified: meta.modified,
              rawBytes: new Uint8Array(plainBuf, dataBaseOffset + meta.offset, meta.size)
            }));

            mountVirtualFiles(vaultRoot, activeRequest.item.modified, records);
          } else {
            // Backward compatibility for legacy hex-encoded JSON vaults
            const hex = new TextDecoder().decode(bytes).replace(/\s+/g, '');
            const hexBytes = new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
            const salt = hexBytes.slice(0, 16);
            const iv = hexBytes.slice(16, 28);
            const ciphertext = hexBytes.slice(28);

            const key = await deriveAesKey(password, salt);
            const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
            const parsed = JSON.parse(new TextDecoder().decode(decrypted));

            if (!parsed || !Array.isArray(parsed.files)) {
              throw new Error('Corrupted vault structure');
            }
            mountVirtualFiles(vaultRoot, activeRequest.item.modified, parsed.files);
          }
        } else {
          // Single locked link (.locked.txt) — works both at root and nested inside vaults
          const hex = new TextDecoder().decode(bytes).replace(/\s+/g, '');
          const linkBytes = new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
          const salt = linkBytes.slice(0, 16);
          const iv = linkBytes.slice(16, 28);
          const ciphertext = linkBytes.slice(28);

          const key = await deriveAesKey(password, salt);
          const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
          const targetUrl = extractTargetUrl(new TextDecoder().decode(decrypted));

          openLinkInViewer(activeRequest.item, targetUrl, true);
        }
      } catch (e) {
        errEl.textContent = 'Access denied: Invalid passphrase.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Decrypt & Open';
      }
    }

    loadManifest();
  </script>
