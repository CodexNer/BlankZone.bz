<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page - Select or create a notebook</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }

    /* Top Header */
    .navbar {
      max-width: 1140px;
      margin: 0 auto;
      padding: 10px 15px 6px;
      display: flex;
      align-items: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #4e4e4e;
      font-size: 23px;
      font-weight: 400;
      letter-spacing: -0.3px;
    }

    /* Main Container & Bootstrap-style Tabs */
    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 15px 40px;
    }
    .nav-tabs {
      display: flex;
      list-style: none;
      margin: 8px 0 14px;
      padding: 0;
      border-bottom: 1px solid #ddd;
    }
    .nav-tabs li {
      margin-bottom: -1px;
    }
    .nav-tabs button {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px 4px 0 0;
      padding: 8px 15px;
      font-size: 13px;
      color: #337ab7;
      cursor: pointer;
    }
    .nav-tabs button:hover {
      background: #eee;
      border-color: #eee #eee #ddd;
    }
    .nav-tabs button.active {
      color: #555;
      background: #fff;
      border: 1px solid #ddd;
      border-bottom-color: transparent;
      cursor: default;
    }

    /* Sub-toolbar */
    .sub-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .hint-text { color: #333; }
    .hint-text strong { font-weight: 700; }
    .btn-group { display: flex; gap: 6px; }
    .btn {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 4px 10px;
      font-size: 12px;
      color: #333;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn:hover { background: #e6e6e6; border-color: #adadad; }

    /* File Browser Panel */
    .list-panel {
      border: 1px solid #ddd;
      border-radius: 4px;
      overflow: hidden;
    }
    .list-header {
      background: #eee;
      padding: 6px 10px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .select-box-btn {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 3px 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .breadcrumb a {
      color: #337ab7;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb span.sep { color: #777; }

    /* Rows */
    .file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-bottom: 1px solid #ddd;
      background: #fff;
    }
    .file-row:last-child { border-bottom: none; }
    .file-row:hover { background: #f5f5f5; }
    .row-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .row-left input[type="checkbox"] { margin: 0 2px; }
    .row-checkbox-spacer { width: 17px; display: inline-block; }
    .item-link {
      color: #337ab7;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-link:hover { text-decoration: underline; color: #23527c; }
    .row-meta {
      color: #777;
      font-size: 12px;
      white-space: nowrap;
      margin-left: 12px;
    }
    .badge-locked {
      background: #f8f8f8;
      border: 1px solid #ddd;
      color: #666;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      margin-left: 8px;
    }

    /* Decrypt Drawer */
    .decrypt-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: #f8f8f8;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .decrypt-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .decrypt-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .decrypt-controls input {
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 13px;
      width: 260px;
    }
    .btn-primary {
      background: #337ab7;
      border-color: #2e6da4;
      color: #fff;
    }
    .btn-primary:hover { background: #286090; border-color: #204d74; }
    .error-text { color: #a94442; font-size: 12px; margin-top: 6px; }

    /* Secondary Tab Views */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .empty-state {
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      color: #666;
      background: #fafafa;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a class="brand" href="#" onclick="navigateTo(''); return false;">
      <!-- Jupyter Emblem SVG -->
      <svg width="28" height="32" viewBox="0 0 44 51" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 6C12.5 6 4.7 11.2 2.4 18.2C6.5 13.3 13.7 10 22 10C30.3 10 37.5 13.3 41.6 18.2C39.3 11.2 31.5 6 22 6Z" fill="#F37626"/>
        <path d="M22 45C31.5 45 39.3 39.8 41.6 32.8C37.5 37.7 30.3 41 22 41C13.7 41 6.5 37.7 2.4 32.8C4.7 39.8 12.5 45 22 45Z" fill="#F37626"/>
        <circle cx="36.5" cy="7.5" r="2.6" fill="#767677"/>
        <circle cx="7.5" cy="43.5" r="3.4" fill="#4E4E4E"/>
        <circle cx="9.5" cy="6.5" r="1.8" fill="#9E9E9E"/>
      </svg>
      <span>jupyter</span>
    </a>
  </header>

  <main class="container">
    <ul class="nav-tabs">
      <li><button class="active" onclick="switchTab('files', this)">Files</button></li>
      <li><button onclick="switchTab('running', this)">Running</button></li>
      <li><button onclick="switchTab('clusters', this)">Clusters</button></li>
    </ul>

    <!-- FILES TAB -->
    <section id="tab-files" class="tab-panel active">
      <div class="sub-toolbar">
        <div class="hint-text">
          Select items to perform actions on them.
        </div>
        <div class="btn-group">
          <button class="btn" onclick="alert('Read-only archive mode.')">New ▾</button>
          <button class="btn" title="Refresh file list" onclick="loadManifest()">↻</button>
        </div>
      </div>

      <div class="list-panel">
        <div class="list-header">
          <div class="select-box-btn">
            <input type="checkbox" id="selectAll" onchange="toggleAll(this.checked)">
            <span style="font-size:10px; color:#555;">▾</span>
          </div>
          <nav class="breadcrumb" id="breadcrumb"></nav>
        </div>
        <div id="fileList"></div>
      </div>

      <!-- AES-GCM Passphrase Box -->
      <div id="decryptBox" class="decrypt-box">
        <div class="decrypt-box-header">
          <span>🔒 Enter clearance passphrase to decrypt <strong id="decryptTargetName"></strong>:</span>
          <button class="btn" onclick="closeDecryptBox()">✕</button>
        </div>
        <div class="decrypt-controls">
          <input type="password" id="passInput" placeholder="Passphrase..." onkeydown="if(event.key==='Enter') decryptAndRedirect()">
          <button class="btn btn-primary" onclick="decryptAndRedirect()">Decrypt & Open</button>
        </div>
        <div id="decryptError" class="error-text"></div>
      </div>
    </section>

    <!-- RUNNING TAB -->
    <section id="tab-running" class="tab-panel">
      <div class="empty-state">There are no terminals or notebooks running in this static archive.</div>
    </section>

    <!-- CLUSTERS TAB -->
    <section id="tab-clusters" class="tab-panel">
      <div class="empty-state">Clusters tab is disabled on GitHub Pages static deployment.</div>
    </section>
  </main>

  <script>
    let allEntries = [];
    let currentPath = '';
    let activeLockedPath = '';

    const ICONS = {
      home: `<svg width="14" height="14" viewBox="0 0 16 16" fill="#337ab7"><path d="M8 1.5L1 7.5h2v6h4v-4h2v4h4v-6h2L8 1.5z"/></svg>`,
      folder: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#555" stroke-width="1.3"><path d="M1.5 3.5h4.5l1.5 1.5h7v7.5h-13z"/></svg>`,
      notebook: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#555" stroke-width="1.3"><rect x="3" y="1.5" width="10" height="13" rx="1"/><line x1="5.5" y1="5" x2="10.5" y2="5"/><line x1="5.5" y1="8" x2="10.5" y2="8"/><line x1="5.5" y1="11" x2="8.5" y2="11"/></svg>`,
      lock: `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#b35900" stroke-width="1.3"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>`
    };

    function switchTab(tabName, btn) {
      document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    async function loadManifest() {
      try {
        const res = await fetch('manifest.json?t=' + Date.now());
        if (!res.ok) throw new Error('manifest.json not found');
        allEntries = await res.json();
        renderDirectory();
      } catch (err) {
        document.getElementById('fileList').innerHTML = `
          <div class="file-row">
            <span style="color:#777;">Waiting for <code>manifest.json</code> — push to GitHub to trigger the auto-indexer.</span>
          </div>`;
        renderBreadcrumb();
      }
    }

    function navigateTo(folderPath) {
      currentPath = folderPath;
      closeDecryptBox();
      document.getElementById('selectAll').checked = false;
      renderDirectory();
    }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumb');
      let html = `<a onclick="navigateTo('')" title="Root">${ICONS.home}</a>`;
      if (currentPath) {
        const parts = currentPath.split('/');
        let accum = '';
        parts.forEach((part, idx) => {
          accum = idx === 0 ? part : `${accum}/${part}`;
          const target = accum;
          html += `<span class="sep">/</span><a onclick="navigateTo('${target}')">${part}</a>`;
        });
      }
      bc.innerHTML = html;
    }

    function renderDirectory() {
      renderBreadcrumb();
      const listEl = document.getElementById('fileList');
      listEl.innerHTML = '';

      // Add ".." parent row when inside a subfolder
      if (currentPath !== '') {
        const parentPath = currentPath.includes('/')
          ? currentPath.substring(0, currentPath.lastIndexOf('/'))
          : '';
        const upRow = document.createElement('div');
        upRow.className = 'file-row';
        upRow.innerHTML = `
          <div class="row-left">
            <span class="row-checkbox-spacer"></span>
            ${ICONS.folder}
            <a class="item-link" onclick="navigateTo('${parentPath}')">..</a>
          </div>
          <div class="row-meta"></div>`;
        listEl.appendChild(upRow);
      }

      // Filter entries belonging strictly to currentPath
      const items = allEntries.filter(entry => {
        const lastSlash = entry.path.lastIndexOf('/');
        const parent = lastSlash === -1 ? '' : entry.path.substring(0, lastSlash);
        return parent === currentPath;
      });

      // Sort folders first, then files alphabetically
      items.sort((a, b) => {
        if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
        return a.name.localeCompare(b.name);
      });

      if (items.length === 0) {
        const emptyRow = document.createElement('div');
        emptyRow.className = 'file-row';
        emptyRow.innerHTML = `<span style="color:#777; padding-left:27px;">Directory is empty.</span>`;
        listEl.appendChild(emptyRow);
        return;
      }

      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'file-row';

        let icon = ICONS.notebook;
        let badge = '';
        if (item.type === 'dir') {
          icon = ICONS.folder;
        } else if (item.locked) {
          icon = ICONS.lock;
          badge = `<span class="badge-locked">Encrypted</span>`;
        }

        const link = document.createElement('a');
        link.className = 'item-link';
        link.textContent = item.name;

        if (item.type === 'dir') {
          link.onclick = () => navigateTo(item.path);
        } else if (item.locked) {
          link.onclick = () => openDecryptBox(item.path, item.name);
        } else {
          link.href = item.path;
          link.target = '_blank';
        }

        const left = document.createElement('div');
        left.className = 'row-left';
        left.innerHTML = `<input type="checkbox" class="row-check">${icon}`;
        left.appendChild(link);
        if (badge) left.insertAdjacentHTML('beforeend', badge);

        const meta = document.createElement('div');
        meta.className = 'row-meta';
        meta.textContent = item.modified || '';

        row.appendChild(left);
        row.appendChild(meta);
        listEl.appendChild(row);
      });
    }

    function toggleAll(checked) {
      document.querySelectorAll('.row-check').forEach(cb => cb.checked = checked);
    }

    function openDecryptBox(filePath, fileName) {
      activeLockedPath = filePath;
      document.getElementById('decryptTargetName').textContent = fileName;
      document.getElementById('decryptError').textContent = '';
      document.getElementById('passInput').value = '';
      document.getElementById('decryptBox').style.display = 'block';
      document.getElementById('passInput').focus();
    }

    function closeDecryptBox() {
      document.getElementById('decryptBox').style.display = 'none';
      activeLockedPath = '';
    }

    async function decryptAndRedirect() {
      const password = document.getElementById('passInput').value;
      const errEl = document.getElementById('decryptError');
      errEl.textContent = '';

      try {
        const res = await fetch(activeLockedPath);
        const hex = (await res.text()).trim();
        const bytes = new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));

        const salt = bytes.slice(0, 16);
        const iv = bytes.slice(16, 28);
        const ciphertext = bytes.slice(28);

        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
        );
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
        const targetUrl = new TextDecoder().decode(decrypted);
        window.location.href = targetUrl;
      } catch (e) {
        errEl.textContent = 'Access denied: Invalid passphrase.';
      }
    }

    loadManifest();
  </script>
</body>
</html>
